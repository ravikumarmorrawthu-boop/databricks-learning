    mode: development
    default: true
    workspace:
      host: https://adb-3043462286994528.8.azuredatabricks.net
    variables:
      catalog: databrickslearning
      schema: dev
    presets:
      artifacts_dynamic_version: true
  prod:
    mode: production
    workspace:
      host: https://adb-3043462286994528.8.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/rawi.morraw_gmail.com#ext#@rawimorrawgmail.onmicrosoft.com to make sure we only have a single copy.
      root_path: /Workspace/Users/rawi.morraw_gmail.com#ext#@rawimorrawgmail.onmicrosoft.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: databrickslearning
      schema: prod
    permissions:
